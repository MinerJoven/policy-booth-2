name: Check Policy Updates

on:
  schedule:
    # Monthly on the 1st at 05:00 UTC
    - cron: "0 5 1 * *"
  workflow_dispatch:
    inputs:
      full_scrape:
        description: "Force full scrape (ignore ETag)"
        required: false
        default: "false"

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Sync Policies
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          FULL_SCRAPE: ${{ inputs.full_scrape }}
        run: |
          node scripts/check-policy-updates.mjs